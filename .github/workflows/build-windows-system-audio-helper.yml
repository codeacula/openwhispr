name: Build Windows System Audio Helper

on:
  push:
    paths:
      - 'resources/windows-system-audio-helper.c'
      - '.github/workflows/build-windows-system-audio-helper.yml'
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., 1.0.0)'
        required: false
        default: '1.2.0'
        type: string
      arch:
        description: 'Architectures to build and upload (all also rebuilds and replaces the released x64 zip)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - arm64
          - x64

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        # Each arch builds on its own runner, so the checks below run the binary
        # that ships. A push builds both; a dispatch can add just one arch's zip.
        include: ${{ fromJSON(inputs.arch == 'arm64' && '[{"arch":"arm64","os":"windows-11-arm"}]' || inputs.arch == 'x64' && '[{"arch":"x64","os":"windows-latest"}]' || '[{"arch":"x64","os":"windows-latest"},{"arch":"arm64","os":"windows-11-arm"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: ${{ matrix.arch }}

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Compile Windows System Audio Helper
        run: |
          cl /O2 /nologo resources/windows-system-audio-helper.c /Fe:windows-system-audio-helper.exe ole32.lib mmdevapi.lib
        shell: cmd

      - name: Verify binary
        run: |
          if (Test-Path "windows-system-audio-helper.exe") {
            Write-Host "Binary built successfully"
            Get-Item "windows-system-audio-helper.exe" | Select-Object Name, Length
          } else {
            Write-Error "Binary not found"
            exit 1
          }
        shell: pwsh

      - name: Smoke test probe
        run: |
          $output = & .\windows-system-audio-helper.exe probe
          Write-Host "Probe output: $output"
          if ($output -notmatch '"ok":') {
            Write-Error "Probe did not return JSON"
            exit 1
          }
        shell: pwsh

      - name: Verify architecture
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("windows-system-audio-helper.exe")
          $machine = [BitConverter]::ToUInt16($bytes, [BitConverter]::ToInt32($bytes, 0x3c) + 4)
          $expected = @{ x64 = 0x8664; arm64 = 0xAA64 }['${{ matrix.arch }}']
          if ($machine -ne $expected) {
            Write-Error ("windows-system-audio-helper.exe is PE machine 0x{0:X4}, expected 0x{1:X4}" -f $machine, $expected)
            exit 1
          }
        shell: pwsh

      - name: Create zip archive
        run: |
          Compress-Archive -Path windows-system-audio-helper.exe -DestinationPath windows-system-audio-helper-win32-${{ matrix.arch }}.zip
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-system-audio-helper-win32-${{ matrix.arch }}
          path: windows-system-audio-helper-win32-${{ matrix.arch }}.zip

      - name: Create or update release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: windows-system-audio-helper-v${{ inputs.version || '1.2.0' }}
          name: Windows System Audio Helper v${{ inputs.version || '1.2.0' }}
          body: |
            Prebuilt Windows system audio helper binary for meeting transcription.

            Captures system audio via WASAPI process loopback (exclude mode),
            hearing every application on every output device while excluding
            OpenWhispr's own audio. Requires Windows 10 2004 or later; older
            systems automatically fall back to Chromium display-media loopback.
          files: windows-system-audio-helper-win32-${{ matrix.arch }}.zip
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
