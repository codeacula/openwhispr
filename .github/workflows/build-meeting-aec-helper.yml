name: Build Meeting AEC Helper

on:
  push:
    paths:
      - "native/meeting-aec-helper/**"
      - "scripts/build-meeting-aec-helper.js"
      - "scripts/lib/meeting-aec-build.js"
      - ".github/workflows/build-meeting-aec-helper.yml"
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., 1.0.0)"
        required: false
        default: "1.0.0"
        type: string
      target:
        description: "Build and upload every target, or only win32-arm64 (leaves the published binaries untouched)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - win32-arm64

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # win32-arm64 builds natively: the ClangCL toolset and ARM64 tools ship
        # on windows-11-arm
        include: ${{ fromJSON(inputs.target == 'win32-arm64' && '[{"os":"windows-11-arm","platform":"win32","arch":"arm64"}]' || '[{"os":"ubuntu-latest","platform":"linux","arch":"x64"},{"os":"windows-latest","platform":"win32","arch":"x64"},{"os":"windows-11-arm","platform":"win32","arch":"arm64"},{"os":"macos-latest","platform":"darwin","arch":"arm64"},{"os":"macos-latest","platform":"darwin","arch":"x64"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup MSVC (Windows)
        if: matrix.platform == 'win32'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Install Linux build deps
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential python3

      - name: Build meeting AEC helper
        run: node scripts/build-meeting-aec-helper.js --arch ${{ matrix.arch }}
        env:
          TARGET_ARCH: ${{ matrix.arch }}

      - name: Verify binary
        shell: bash
        run: |
          BIN="resources/bin/meeting-aec-helper-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.platform == 'win32' && '.exe' || '' }}"
          test -f "$BIN" || { echo "Binary not found: $BIN"; exit 1; }
          ls -la "$BIN"

      - name: Verify architecture (Windows)
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          $bin = "resources/bin/meeting-aec-helper-win32-${{ matrix.arch }}.exe"
          $bytes = [System.IO.File]::ReadAllBytes($bin)
          $machine = [BitConverter]::ToUInt16($bytes, [BitConverter]::ToInt32($bytes, 0x3c) + 4)
          $expected = @{ x64 = 0x8664; arm64 = 0xAA64 }['${{ matrix.arch }}']
          if ($machine -ne $expected) {
            Write-Error ("$bin is PE machine 0x{0:X4}, expected 0x{1:X4}" -f $machine, $expected)
            exit 1
          }

      - name: Package (tar.gz)
        if: matrix.platform != 'win32'
        run: |
          cd resources/bin
          tar -czf "../../meeting-aec-helper-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz" "meeting-aec-helper-${{ matrix.platform }}-${{ matrix.arch }}"

      - name: Package (zip)
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          Compress-Archive -Path "resources/bin/meeting-aec-helper-win32-${{ matrix.arch }}.exe" -DestinationPath "meeting-aec-helper-win32-${{ matrix.arch }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: meeting-aec-helper-${{ matrix.platform }}-${{ matrix.arch }}
          path: meeting-aec-helper-${{ matrix.platform }}-${{ matrix.arch }}.*

      - name: Create or update release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: meeting-aec-helper-v${{ inputs.version || '1.0.0' }}
          name: Meeting AEC Helper v${{ inputs.version || '1.0.0' }}
          body: |
            Prebuilt WebRTC Audio Processing sidecar for meeting mic echo cancellation.

            Binaries built from `native/meeting-aec-helper/` against pinned webrtc-apm + abseil-cpp commits.
          files: meeting-aec-helper-${{ matrix.platform }}-${{ matrix.arch }}.*
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
