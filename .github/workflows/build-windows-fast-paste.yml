name: Build Windows Fast Paste

on:
  push:
    paths:
      - "resources/windows-fast-paste.c"
      - ".github/workflows/build-windows-fast-paste.yml"
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., 1.0.0)"
        required: false
        default: "2.0.0"
        type: string
      arch:
        description: "Architectures to build and upload (all also rebuilds and replaces the released x64 zip)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - arm64
          - x64

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        # Each arch builds on its own runner, so the checks below run the binary
        # that ships. A push builds both; a dispatch can add just one arch's zip.
        include: ${{ fromJSON(inputs.arch == 'arm64' && '[{"arch":"arm64","os":"windows-11-arm"}]' || inputs.arch == 'x64' && '[{"arch":"x64","os":"windows-latest"}]' || '[{"arch":"x64","os":"windows-latest"},{"arch":"arm64","os":"windows-11-arm"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: ${{ matrix.arch }}

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Compile Windows Fast Paste
        run: |
          cl /O2 /nologo resources/windows-fast-paste.c /Fe:windows-fast-paste.exe user32.lib
        shell: cmd

      - name: Verify binary
        run: |
          if (Test-Path "windows-fast-paste.exe") {
            Write-Host "Binary built successfully"
            Get-Item "windows-fast-paste.exe" | Select-Object Name, Length
            $capabilities = & .\windows-fast-paste.exe --capabilities
            if ($capabilities -notmatch "selection-copy-v1") {
              Write-Error "Binary does not advertise selection-copy-v1"
              exit 1
            }
          } else {
            Write-Error "Binary not found"
            exit 1
          }
        shell: pwsh

      - name: Verify architecture
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("windows-fast-paste.exe")
          $machine = [BitConverter]::ToUInt16($bytes, [BitConverter]::ToInt32($bytes, 0x3c) + 4)
          $expected = @{ x64 = 0x8664; arm64 = 0xAA64 }['${{ matrix.arch }}']
          if ($machine -ne $expected) {
            Write-Error ("windows-fast-paste.exe is PE machine 0x{0:X4}, expected 0x{1:X4}" -f $machine, $expected)
            exit 1
          }
        shell: pwsh

      - name: Create zip archive
        run: |
          Compress-Archive -Path windows-fast-paste.exe -DestinationPath windows-fast-paste-win32-${{ matrix.arch }}.zip
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-fast-paste-win32-${{ matrix.arch }}
          path: windows-fast-paste-win32-${{ matrix.arch }}.zip

      - name: Create or update release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: windows-fast-paste-v${{ inputs.version || '2.0.0' }}
          name: Windows Fast Paste v${{ inputs.version || '2.0.0' }}
          body: |
            Prebuilt Windows fast-paste binary for clipboard paste and selection-copy operations.

            Uses Win32 SendInput API with automatic terminal detection for
            paste (Ctrl+V/Ctrl+Shift+V) and copy (Ctrl+C/Ctrl+Shift+C).
          files: windows-fast-paste-win32-${{ matrix.arch }}.zip
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
