name: Build and Notarize

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - "openwhispr-mobile/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml
    permissions:
      contents: read

  quality:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ github.event_name != 'pull_request' || (github.base_ref == 'main' && needs.changes.outputs.build == 'true') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run quality checks
        run: npm run quality-check
      - name: Check translations
        run: npm run i18n:check
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Build better-sqlite3 for the runner's node
        # --ignore-scripts skips the native build; DB-backed tests silently
        # skip without it. This job is the only test gate on push to main.
        # Guarded like the test step below, or the rebuild is skipped and the
        # suite then fails REQUIRE_DB_TESTS on a missing binding instead.
        if: ${{ !cancelled() }}
        run: npm rebuild better-sqlite3
      - name: Run tests
        # The gates above fail on drift that has nothing to do with the suite —
        # a stray format nit, a missing locale key, a fresh advisory. Without
        # this, main goes untested for as long as the drift stands (#1735).
        if: ${{ !cancelled() }}
        run: npm test
        env:
          # keeps require("electron") from throwing when postinstall was skipped
          ELECTRON_OVERRIDE_DIST_PATH: /tmp
          # a skipped DB test here means the rebuild step above is gone: fail instead
          REQUIRE_DB_TESTS: "1"

  build-linux:
    needs: quality
    if: needs.quality.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install platform-specific native binaries
        run: npm install @rollup/rollup-linux-x64-gnu lightningcss-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu --no-save

      - name: Cache native binaries
        uses: actions/cache@v4
        with:
          path: resources/bin
          key: linux-x64-bin-${{ hashFiles('scripts/download-*.js') }}

      - name: Download whisper.cpp binaries
        run: node scripts/download-whisper-cpp.js --current
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

      - name: Download llama-server binaries
        run: node scripts/download-llama-server.js --current
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

      - name: Download sherpa-onnx binaries
        run: node scripts/download-sherpa-onnx.js --current
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

      - name: Download yt-dlp binary
        run: node scripts/download-yt-dlp.js --current

      - name: Download Qdrant binary
        run: node scripts/download-qdrant.js --current
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

      - name: Download meeting AEC helper
        run: node scripts/download-meeting-aec-helper.js --current
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: linux-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: linux-electron-

      - name: Install Linux build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libx11-dev libxtst-dev libatspi2.0-dev libglib2.0-dev libpipewire-0.3-dev pkg-config

      - name: Create runtime env
        run: |
          echo "GOOGLE_CALENDAR_CLIENT_ID=${{ secrets.GOOGLE_CALENDAR_CLIENT_ID }}" >> .env
          echo "GOOGLE_CALENDAR_CLIENT_SECRET=${{ secrets.GOOGLE_CALENDAR_CLIENT_SECRET }}" >> .env
          echo "MICROSOFT_CALENDAR_CLIENT_ID=${{ secrets.MICROSOFT_CALENDAR_CLIENT_ID }}" >> .env
          echo "SLACK_CLIENT_ID=${{ secrets.SLACK_CLIENT_ID }}" >> .env
          echo "LINEAR_CLIENT_ID=${{ secrets.LINEAR_CLIENT_ID }}" >> .env
          echo "GITHUB_APP_CLIENT_ID=${{ secrets.GH_APP_CLIENT_ID }}" >> .env
          echo "GITHUB_APP_SLUG=${{ secrets.GH_APP_SLUG }}" >> .env

      - name: Verify PipeWire system audio helper build
        run: |
          npm run compile:linux-system-audio
          # supportsNativeCapture reflects compile-time PipeWire linkage, so this passes on CI runners with no PipeWire daemon (where "ok" is false).
          resources/bin/linux-system-audio-helper probe | grep '"supportsNativeCapture":true'

      - name: Build Application
        run: npm run build:linux -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          # Forks and Dependabot get no GH_TOKEN; github.token can't read the private font release.
          BRAND_FONTS_REQUIRED: ${{ secrets.GH_TOKEN && '1' || '0' }}
          VITE_AUTH_URL: ${{ vars.VITE_AUTH_URL || 'https://auth.openwhispr.com' }}
          VITE_OPENWHISPR_API_URL: ${{ vars.VITE_OPENWHISPR_API_URL }}
          VITE_OPENWHISPR_OAUTH_CALLBACK_URL: ${{ vars.VITE_OPENWHISPR_OAUTH_CALLBACK_URL }}

      - name: Upload Artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: linux-build
          path: dist/
          retention-days: 7

  build-windows:
    needs: quality
    if: needs.quality.outputs.build == 'true'
    name: build-windows (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: windows-latest
            builder-args: ""
          # Built natively: cross-building on x64 can't run the helpers' self-checks
          # and npm would install only x64 optional packages (@napi-rs/keyring).
          # latest-arm64.yml sits beside x64's latest.yml (src/updater.js picks the
          # channel), and a non-universal installer gets an -arm64 file name.
          - arch: arm64
            os: windows-11-arm
            builder-args: "--arm64 -c.publish.channel=latest-arm64 -c.nsis.buildUniversalInstaller=false"
    runs-on: ${{ matrix.os }}
    env:
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          # vcvarsall builds x64 by default, even on the arm64 runner
          arch: ${{ matrix.arch }}

      - name: Install dependencies
        run: npm ci
        env:
          # ffmpeg-static has no win32-arm64 binary and its install script fails
          # npm ci there; given an existing file in FFMPEG_BIN it exits early.
          # The x64 ffmpeg is installed in the next step.
          FFMPEG_BIN: ${{ matrix.arch == 'arm64' && format('{0}\package.json', github.workspace) || '' }}

      - name: Install x64 ffmpeg (runs under Windows on Arm's x64 emulation)
        if: matrix.arch == 'arm64'
        shell: bash
        run: npm_config_arch=x64 node node_modules/ffmpeg-static/install.js

      - name: Install platform-specific native binaries
        if: matrix.arch == 'x64'
        run: npm install @rollup/rollup-win32-x64-msvc lightningcss-win32-x64-msvc @tailwindcss/oxide-win32-x64-msvc --no-save

      - name: Cache native binaries
        uses: actions/cache@v4
        with:
          path: resources/bin
          # Per arch, or one arch would restore the other's helpers. Native
          # helper sources are in the key so source changes cannot restore
          # stale helper binaries from the cache.
          key: windows-${{ matrix.arch }}-bin-${{ hashFiles('scripts/download-*.js', 'scripts/build-windows-*.js', 'scripts/build-meeting-aec-helper.js', 'scripts/lib/meeting-aec-build.js', 'resources/windows-*.c', 'native/meeting-aec-helper/**') }}

      - name: Cache NPU runtime packages
        if: matrix.arch == 'arm64'
        uses: actions/cache@v4
        with:
          # ~300 MB of NuGet packages compile:npu-server fetches and sha256-checks
          path: native/whisper-npu-server/third_party
          key: windows-arm64-npu-deps-${{ hashFiles('scripts/build-whisper-npu-server.js') }}

      - name: Download whisper.cpp binaries
        run: node scripts/download-whisper-cpp.js --current
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

      - name: Download llama-server binaries
        run: node scripts/download-llama-server.js --current
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

      - name: Download sherpa-onnx binaries
        run: node scripts/download-sherpa-onnx.js --current
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

      - name: Download yt-dlp binary
        run: node scripts/download-yt-dlp.js --current

      - name: Download Qdrant binary
        run: node scripts/download-qdrant.js --current
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

      - name: Download meeting AEC helper
        run: node scripts/download-meeting-aec-helper.js --current
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

      - name: Build meeting AEC helper when no prebuilt exists
        # Likewise for build-meeting-aec-helper.yml's per-arch zip
        shell: bash
        run: test -f "resources/bin/meeting-aec-helper-win32-${{ matrix.arch }}.exe" || node scripts/build-meeting-aec-helper.js --arch ${{ matrix.arch }}

      - name: Download nircmd.exe
        run: node scripts/download-nircmd.js
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

      - name: Download windows-fast-paste.exe
        run: node scripts/download-windows-fast-paste.js
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

      - name: Compile windows-mic-listener.exe
        shell: cmd
        run: |
          if not exist resources\bin mkdir resources\bin
          cl /O2 /nologo resources\windows-mic-listener.c /Fe:resources\bin\windows-mic-listener.exe ole32.lib oleaut32.lib

      - name: Download windows-system-audio-helper.exe
        run: node scripts/download-windows-system-audio-helper.js
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

      - name: Compile windows-system-audio-helper.exe when no prebuilt exists
        # build-windows-system-audio-helper.yml publishes it per arch; a release
        # that lacks this arch's zip builds the same source here
        shell: cmd
        run: if not exist resources\bin\windows-system-audio-helper.exe cl /O2 /nologo resources\windows-system-audio-helper.c /Fe:resources\bin\windows-system-audio-helper.exe ole32.lib mmdevapi.lib

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/electron/Cache
          key: windows-${{ matrix.arch }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: windows-${{ matrix.arch }}-electron-

      - name: Install x64 .NET 8 runtime for Azure Trusted Signing
        if: matrix.arch == 'arm64' && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          # electron-builder signs through the TrustedSigning module, whose
          # signtool and Azure.CodeSigning dlib are x64-only and need the x64
          # .NET 8 runtime; the arm64 image ships arm64 .NET only.
          # DOTNET_ROOT_X64 points x64 processes at a side-by-side copy.
          $dir = Join-Path $env:RUNNER_TEMP "dotnet-x64"
          $script = Join-Path $env:RUNNER_TEMP "dotnet-install.ps1"
          Invoke-WebRequest -Uri https://dot.net/v1/dotnet-install.ps1 -OutFile $script
          & $script -Runtime dotnet -Channel 8.0 -Architecture x64 -InstallDir $dir
          "DOTNET_ROOT_X64=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Create runtime env
        shell: bash
        run: |
          echo "GOOGLE_CALENDAR_CLIENT_ID=${{ secrets.GOOGLE_CALENDAR_CLIENT_ID }}" >> .env
          echo "GOOGLE_CALENDAR_CLIENT_SECRET=${{ secrets.GOOGLE_CALENDAR_CLIENT_SECRET }}" >> .env
          echo "MICROSOFT_CALENDAR_CLIENT_ID=${{ secrets.MICROSOFT_CALENDAR_CLIENT_ID }}" >> .env
          echo "SLACK_CLIENT_ID=${{ secrets.SLACK_CLIENT_ID }}" >> .env
          echo "LINEAR_CLIENT_ID=${{ secrets.LINEAR_CLIENT_ID }}" >> .env
          echo "GITHUB_APP_CLIENT_ID=${{ secrets.GH_APP_CLIENT_ID }}" >> .env
          echo "GITHUB_APP_SLUG=${{ secrets.GH_APP_SLUG }}" >> .env

      - name: Build and Sign Application
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npm run build:win -- --publish never --config electron-builder.unsigned-win.json ${{ matrix.builder-args }}
          else
            npm run build:win -- --publish never ${{ matrix.builder-args }}
          fi
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          VITE_AUTH_URL: ${{ vars.VITE_AUTH_URL || 'https://auth.openwhispr.com' }}
          VITE_OPENWHISPR_API_URL: ${{ vars.VITE_OPENWHISPR_API_URL }}
          VITE_OPENWHISPR_OAUTH_CALLBACK_URL: ${{ vars.VITE_OPENWHISPR_OAUTH_CALLBACK_URL }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Verify windows-system-audio-helper.exe
        shell: bash
        run: test -f resources/bin/windows-system-audio-helper.exe

      - name: Verify update metadata
        shell: bash
        run: |
          # Each arch has its own update feed: x64 reads latest.yml, arm64
          # latest-arm64.yml (src/updater.js)
          if [ "${{ matrix.arch }}" = arm64 ]; then
            test -f dist/latest-arm64.yml
            test ! -e dist/latest.yml
            grep -q -- '-arm64\.exe' dist/latest-arm64.yml
          else
            test -f dist/latest.yml
            test ! -e dist/latest-arm64.yml
          fi

      - name: Upload Artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.arch == 'x64' && 'windows-build' || format('windows-{0}-build', matrix.arch) }}
          path: dist/
          retention-days: 7

  build-macos:
    needs: quality
    if: needs.quality.outputs.build == 'true'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install ffmpeg-static for target architecture
        if: matrix.arch == 'x64'
        run: |
          rm -f node_modules/ffmpeg-static/ffmpeg
          npm_config_arch=x64 node node_modules/ffmpeg-static/install.js

      - name: Cache native binaries
        uses: actions/cache@v4
        with:
          path: resources/bin
          key: macos-${{ matrix.arch }}-bin-${{ hashFiles('scripts/download-*.js', 'scripts/build-globe-listener.js', 'resources/macos-globe-listener.swift', 'scripts/build-macos-fast-paste.js', 'resources/macos-fast-paste.swift', 'scripts/build-media-remote.js', 'resources/macos-media-remote.swift', 'scripts/build-macos-audio-tap.js', 'resources/macos-audio-tap.swift') }}

      - name: Compile macos-globe-listener binary
        run: npm run compile:globe -- --arch ${{ matrix.arch }}

      - name: Compile macos-fast-paste binary
        run: npm run compile:fast-paste -- --arch ${{ matrix.arch }}

      - name: Test macOS copy and paste keyboard layouts
        run: node --test test/helpers/macosPasteLayout.test.js

      - name: Compile macos-media-remote binary
        run: npm run compile:media-remote -- --arch ${{ matrix.arch }}

      - name: Compile macos-audio-tap binary
        run: npm run compile:audio-tap -- --arch ${{ matrix.arch }}

      - name: Download whisper.cpp binaries
        run: node scripts/download-whisper-cpp.js --current --platform darwin --arch ${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

      - name: Download llama-server binaries
        run: node scripts/download-llama-server.js --current --platform darwin --arch ${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

      - name: Download sherpa-onnx binaries
        run: node scripts/download-sherpa-onnx.js --current --platform darwin --arch ${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

      - name: Download yt-dlp binary
        run: node scripts/download-yt-dlp.js --current --platform darwin --arch ${{ matrix.arch }}

      - name: Download Qdrant binary
        run: node scripts/download-qdrant.js --current --platform darwin --arch ${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

      - name: Download meeting AEC helper
        run: node scripts/download-meeting-aec-helper.js --current --platform darwin --arch ${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: macos-${{ matrix.arch }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: macos-${{ matrix.arch }}-electron-

      - name: Setup macOS Code Signing
        if: github.event_name != 'pull_request'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          API_KEY_PATH=$RUNNER_TEMP/api_key.p8
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > $CERTIFICATE_PATH
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > $API_KEY_PATH

          security create-keychain -p "runner" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "runner" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          security set-key-partition-list -S apple-tool:,apple: -s -k "runner" $KEYCHAIN_PATH

          echo "APPLE_API_KEY=$API_KEY_PATH" >> $GITHUB_ENV

      - name: Create runtime env
        run: |
          echo "GOOGLE_CALENDAR_CLIENT_ID=${{ secrets.GOOGLE_CALENDAR_CLIENT_ID }}" >> .env
          echo "GOOGLE_CALENDAR_CLIENT_SECRET=${{ secrets.GOOGLE_CALENDAR_CLIENT_SECRET }}" >> .env
          echo "MICROSOFT_CALENDAR_CLIENT_ID=${{ secrets.MICROSOFT_CALENDAR_CLIENT_ID }}" >> .env
          echo "SLACK_CLIENT_ID=${{ secrets.SLACK_CLIENT_ID }}" >> .env
          echo "LINEAR_CLIENT_ID=${{ secrets.LINEAR_CLIENT_ID }}" >> .env
          echo "GITHUB_APP_CLIENT_ID=${{ secrets.GH_APP_CLIENT_ID }}" >> .env
          echo "GITHUB_APP_SLUG=${{ secrets.GH_APP_SLUG }}" >> .env

      - name: Build Application (${{ matrix.arch }})
        run: npm run build:mac -- --${{ matrix.arch }} --publish never
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          # Forks and Dependabot get no GH_TOKEN; github.token can't read the private font release.
          BRAND_FONTS_REQUIRED: ${{ secrets.GH_TOKEN && '1' || '0' }}
          VITE_AUTH_URL: ${{ vars.VITE_AUTH_URL || 'https://auth.openwhispr.com' }}
          VITE_OPENWHISPR_API_URL: ${{ vars.VITE_OPENWHISPR_API_URL }}
          VITE_OPENWHISPR_OAUTH_CALLBACK_URL: ${{ vars.VITE_OPENWHISPR_OAUTH_CALLBACK_URL }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify packaged macOS native binaries
        run: |
          APP_PATH=$(ls -d dist/mac*/OpenWhispr.app | head -n1)
          for bin in macos-audio-tap macos-globe-listener macos-fast-paste macos-mic-listener macos-calendar-listener macos-text-monitor macos-window-bounds macos-media-remote; do
            test -x "$APP_PATH/Contents/Resources/bin/$bin" || { echo "Missing in bundle: $bin"; exit 1; }
          done
          test -x "$APP_PATH/Contents/Resources/bin/MediaRemoteAdapter.framework/Versions/A/MediaRemoteAdapter" || { echo "Missing in bundle: MediaRemoteAdapter.framework"; exit 1; }
          test -f "$APP_PATH/Contents/Resources/bin/mediaremote-adapter.pl" || { echo "Missing in bundle: mediaremote-adapter.pl"; exit 1; }
          node scripts/verify-macos-parakeet.js "$APP_PATH"

      - name: Upload Artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}-build
          path: dist/
          retention-days: 7

      - name: Cleanup Certificates
        if: always() && github.event_name != 'pull_request'
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
          rm -f $RUNNER_TEMP/build_certificate.p12
          rm -f $RUNNER_TEMP/api_key.p8

  desktop-status:
    name: Desktop CI
    needs: [changes, quality, build-linux, build-windows, build-macos]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require all selected desktop checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DESKTOP: ${{ needs.changes.outputs.desktop }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          BUILD: ${{ needs.quality.outputs.build }}
          LINUX_RESULT: ${{ needs.build-linux.result }}
          WINDOWS_RESULT: ${{ needs.build-windows.result }}
          MACOS_RESULT: ${{ needs.build-macos.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$DESKTOP" = true ]; then
            test "$QUALITY_RESULT" = success
            if [ "$BUILD" = true ]; then
              test "$LINUX_RESULT" = success
              test "$WINDOWS_RESULT" = success
              test "$MACOS_RESULT" = success
            fi
          fi
