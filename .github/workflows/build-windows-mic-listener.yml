name: Build Windows Mic Listener

on:
  push:
    paths:
      - 'resources/windows-mic-listener.c'
      - '.github/workflows/build-windows-mic-listener.yml'
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Override version tag (defaults to MIC_LISTENER_VERSION in the C source)'
        required: false
        default: ''
        type: string
      arch:
        description: 'Architectures to build and upload (all also rebuilds and replaces the released x64 zip)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - arm64
          - x64

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        # Each arch builds on its own runner, so the checks below run the binary
        # that ships. A push builds both; a dispatch can add just one arch's zip.
        include: ${{ fromJSON(inputs.arch == 'arm64' && '[{"arch":"arm64","os":"windows-11-arm"}]' || inputs.arch == 'x64' && '[{"arch":"x64","os":"windows-latest"}]' || '[{"arch":"x64","os":"windows-latest"},{"arch":"arm64","os":"windows-11-arm"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The release tag comes from the source so protocol changes ship under a
      # new tag and download-windows-mic-listener.js (pinned to the same
      # constant) can never silently pick up a binary built from older source.
      - name: Read binary version from source
        id: version
        run: |
          $match = Select-String -Path resources/windows-mic-listener.c -Pattern 'MIC_LISTENER_VERSION "([0-9.]+)"'
          if (-not $match) {
            Write-Error "MIC_LISTENER_VERSION not found in resources/windows-mic-listener.c"
            exit 1
          }
          "version=$($match.Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: ${{ matrix.arch }}

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Compile Windows Mic Listener
        run: |
          cl /O2 /nologo resources/windows-mic-listener.c /Fe:windows-mic-listener.exe ole32.lib oleaut32.lib
        shell: cmd

      - name: Verify binary
        run: |
          if (Test-Path "windows-mic-listener.exe") {
            Write-Host "Binary built successfully"
            Get-Item "windows-mic-listener.exe" | Select-Object Name, Length
          } else {
            Write-Error "Binary not found"
            exit 1
          }
        shell: pwsh

      - name: Verify architecture
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("windows-mic-listener.exe")
          $machine = [BitConverter]::ToUInt16($bytes, [BitConverter]::ToInt32($bytes, 0x3c) + 4)
          $expected = @{ x64 = 0x8664; arm64 = 0xAA64 }['${{ matrix.arch }}']
          if ($machine -ne $expected) {
            Write-Error ("windows-mic-listener.exe is PE machine 0x{0:X4}, expected 0x{1:X4}" -f $machine, $expected)
            exit 1
          }
        shell: pwsh

      - name: Create zip archive
        run: |
          Compress-Archive -Path windows-mic-listener.exe -DestinationPath windows-mic-listener-win32-${{ matrix.arch }}.zip
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-mic-listener-win32-${{ matrix.arch }}
          path: windows-mic-listener-win32-${{ matrix.arch }}.zip

      - name: Create or update release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: windows-mic-listener-v${{ inputs.version || steps.version.outputs.version }}
          name: Windows Mic Listener v${{ inputs.version || steps.version.outputs.version }}
          body: |
            Prebuilt Windows mic listener binary for event-driven microphone detection.

            Uses WASAPI IAudioSessionManager2 to monitor capture sessions with
            per-PID refcounting across all capture endpoints (hot-plug aware).
            Announces "CAPABILITY PID" on stdout; PID exclusions are handled by
            the JavaScript caller.
          files: windows-mic-listener-win32-${{ matrix.arch }}.zip
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
